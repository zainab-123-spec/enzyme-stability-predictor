[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enzstab"
version = "0.1.0"
description = "Kaggle Novozymes Enzyme Stability Prediction & AlphaFold 3D Thermostability Benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Zainab Javed", email = "276657223+zainab-123-spec@users.noreply.github.com"}
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "requests>=2.31",
    "streamlit>=1.30",
]

[project.scripts]
enzstab = "enzstab.cli:main"

[tool.setuptools.packages.find]
include = ["enzstab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
